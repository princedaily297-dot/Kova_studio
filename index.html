  <script>
    // ================= STATE MANAGEMENT =================
    let credits = 15;
    let castList = [];
    let activeCharId = null;
    let currentScenes = [];
    let reelTimer = null;

    function safeGet(key, fallback) {
      try {
        const val = localStorage.getItem(key);
        return val !== null ? val : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeSet(key, val) {
      try {
        localStorage.setItem(key, String(val));
      } catch (e) {}
    }

    function dismissSplash() {
      const splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
      }
    }

    // Fail-safe splash dismissal: runs on load, after 1.8s, hard-capped at 3.5s, or on tap
    setTimeout(dismissSplash, 1800);
    setTimeout(dismissSplash, 3500);
    document.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splash-screen');
      if (splash) splash.addEventListener('click', dismissSplash);

      credits = parseInt(safeGet('kova_credits', '15'), 10) || 15;
      try {
        castList = JSON.parse(safeGet('kova_cast', '[]')) || [];
      } catch (e) {
        castList = [];
      }
      activeCharId = safeGet('kova_active_char', null);

      updateCreditUI();
      renderCastList();

      const keyInput = document.getElementById('gemini-key-input');
      if (keyInput) keyInput.value = safeGet('kova_gemini_key', '');
    });

    window.addEventListener('load', () => {
      setTimeout(dismissSplash, 600);
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function updateCreditUI() {
      document.getElementById('credit-count').textContent = credits;
      safeSet('kova_credits', credits);
    }

    function refillCredits() {
      credits += 10;
      updateCreditUI();
      showToast('⚡ +10 Studio Credits added!');
    }

    function openModal(id) {
      document.getElementById(id).classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function saveSettings() {
      const key = document.getElementById('gemini-key-input').value.trim();
      safeSet('kova_gemini_key', key);
      closeModal('settings-modal');
      showToast(key ? '✅ Gemini API Key saved locally!' : 'Settings saved');
    }

    // ================= FALLBACK ART + IMAGE GENERATOR =================
    function makeFallbackDataUrl(label, sublabel) {
      const safeTitle = String(label || 'KovaStudio AI').slice(0, 24).replace(/[<>&"]/g, '');
      const safeSub = String(sublabel || 'Scene Frame').slice(0, 34).replace(/[<>&"]/g, '');
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1152" viewBox="0 0 720 1152">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1b1438"/>
            <stop offset="55%" stop-color="#0d1b2a"/>
            <stop offset="100%" stop-color="#162447"/>
          </linearGradient>
        </defs>
        <rect width="720" height="1152" fill="url(#g)"/>
        <circle cx="360" cy="460" r="145" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.6"/>
        <circle cx="360" cy="460" r="110" fill="#8b5cf6" opacity="0.16"/>
        <text x="360" y="475" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="64" font-weight="bold">${safeTitle.charAt(0) || 'K'}</text>
        <text x="360" y="665" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="32" font-weight="bold">${safeTitle}</text>
        <text x="360" y="715" text-anchor="middle" fill="#67e8f9" font-family="sans-serif" font-size="20">${safeSub}</text>
      </svg>`;
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    }

    function buildImageUrl(prompt, seed, width = 720, height = 1152) {
      const encoded = encodeURIComponent(String(prompt).slice(0, 320));
      return `https://image.pollinations.ai/prompt/${encoded}?width=${width}&height=${height}&seed=${seed}&nologo=true`;
    }

    function attachImgFallback(imgEl, title, subtitle) {
      imgEl.onerror = function () {
        if (!this.dataset.fbApplied) {
          this.dataset.fbApplied = '1';
          this.src = makeFallbackDataUrl(title, subtitle);
        }
      };
    }

    // ================= STEP 1: CHARACTER CREATION =================
    function createCharacter() {
      const name = document.getElementById('char-name').value.trim();
      const desc = document.getElementById('char-desc').value.trim();
      const style = document.getElementById('char-style').value;

      if (!name || !desc) {
        showToast('⚠️ Enter both character name and appearance!');
        return;
      }

      const seed = Math.floor(100000 + Math.random() * 900000);
      const portraitPrompt = `Character reference portrait of ${name}, ${desc}, ${style}, centered close-up portrait, consistent facial features`;
      const avatarUrl = buildImageUrl(portraitPrompt, seed, 512, 512);

      const newChar = {
        id: 'char_' + Date.now(),
        name,
        desc,
        style,
        seed,
        avatarUrl
      };

      castList.unshift(newChar);
      activeCharId = newChar.id;
      safeSet('kova_cast', JSON.stringify(castList));
      safeSet('kova_active_char', activeCharId);

      renderCastList();
      showToast(`✨ ${name} locked into your Cast!`);
    }

    function selectCharacter(id) {
      activeCharId = id;
      safeSet('kova_active_char', id);
      renderCastList();
    }

    function deleteCharacter(e, id) {
      e.stopPropagation();
      castList = castList.filter(c => c.id !== id);
      if (activeCharId === id) {
        activeCharId = castList.length ? castList[0].id : null;
      }
      safeSet('kova_cast', JSON.stringify(castList));
      renderCastList();
      showToast('Character removed from Cast');
    }

    function renderCastList() {
      const container = document.getElementById('cast-container');
      const listEl = document.getElementById('cast-list');
      const indicator = document.getElementById('active-char-indicator');

      if (!castList.length) {
        container.style.display = 'none';
        indicator.textContent = 'No character selected';
        return;
      }

      container.style.display = 'block';
      listEl.innerHTML = '';

      castList.forEach(char => {
        const isActive = char.id === activeCharId;
        if (isActive) {
          indicator.textContent = `Active Cast: ${char.name}`;
        }

        const card = document.createElement('div');
        card.className = `cast-card ${isActive ? 'active' : ''}`;
        card.onclick = () => selectCharacter(char.id);

        const delBtn = document.createElement('button');
        delBtn.className = 'cast-del';
        delBtn.textContent = '✕';
        delBtn.onclick = (ev) => deleteCharacter(ev, char.id);

        const img = document.createElement('img');
        img.className = 'cast-avatar';
        img.alt = char.name;
        attachImgFallback(img, char.name, char.style.split(',')[0]);
        img.src = char.avatarUrl;

        const nameDiv = document.createElement('div');
        nameDiv.className = 'cast-name';
        nameDiv.textContent = char.name;

        const tagDiv = document.createElement('div');
        tagDiv.className = 'cast-style-tag';
        tagDiv.textContent = char.style.split(',')[0];

        card.append(delBtn, img, nameDiv, tagDiv);
        listEl.appendChild(card);
      });
    }

    // ================= STEP 2: STORY-TO-SCENE ENGINE =================
    async function generateStoryboard() {
      const storyText = document.getElementById('story-input').value.trim();
      const count = parseInt(document.getElementById('scene-count').value, 10);
      const activeChar = castList.find(c => c.id === activeCharId);

      if (!activeChar) {
        showToast('⚠️ Create or select a character in Step 1 first!');
        return;
      }
      if (!storyText) {
        showToast('⚠️ Write or paste your story first!');
        return;
      }
      if (credits < 2) {
        showToast('⚠️ Out of credits! Open ⚙️ to refill test credits.');
        return;
      }

      const btn = document.getElementById('btn-generate-story');
      btn.disabled = true;
      btn.textContent = '⏳ Directing Scenes & Rendering Cast...';

      try {
        const apiKey = safeGet('kova_gemini_key', '');
        let scenesData = [];

        if (apiKey) {
          scenesData = await splitStoryWithGemini(apiKey, storyText, activeChar, count);
        } else {
          scenesData = splitStoryLocally(storyText, activeChar, count);
        }

        currentScenes = scenesData.map((sc, idx) => {
          const fullVisualPrompt = `${activeChar.name}, ${activeChar.desc}, ${sc.action}, ${activeChar.style}, vertical 9:16 composition, cinematic framing`;
          return {
            number: idx + 1,
            charName: activeChar.name,
            narration: sc.narration,
            action: sc.action,
            fullPrompt: fullVisualPrompt,
            imageUrl: buildImageUrl(fullVisualPrompt, activeChar.seed + idx)
          };
        });

        credits -= 2;
        updateCreditUI();
        renderStoryboard();
        showToast('🎬 Storyboard generated!');
      } catch (err) {
        console.error(err);
        showToast('⚠️ Fallback to built-in director...');
        const fallback = splitStoryLocally(storyText, activeChar, count);
        currentScenes = fallback.map((sc, idx) => {
          const fullVisualPrompt = `${activeChar.name}, ${activeChar.desc}, ${sc.action}, ${activeChar.style}`;
          return {
            number: idx + 1,
            charName: activeChar.name,
            narration: sc.narration,
            action: sc.action,
            fullPrompt: fullVisualPrompt,
            imageUrl: buildImageUrl(fullVisualPrompt, activeChar.seed + idx)
          };
        });
        renderStoryboard();
      } finally {
        btn.disabled = false;
        btn.textContent = '🎬 Direct & Generate 9:16 Storyboard (2 Credits)';
      }
    }

    async function splitStoryWithGemini(apiKey, story, char, count) {
      const sysPrompt = `You are a TikTok AI film director. Break the user's story into exactly ${count} consecutive visual scenes featuring the main character "${char.name}" (${char.desc}). Return ONLY valid JSON array of objects with keys "narration" (punchy 1-sentence voiceover) and "action" (visual scene action & camera angle, do not repeat character appearance).`;

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `${sysPrompt}\n\nStory: ${story}` }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      const data = await res.json();
      const rawText = data.candidates[0].content.parts[0].text;
      return JSON.parse(rawText);
    }

    function splitStoryLocally(story, char, count) {
      const rawSentences = story
        .replace(/([.!?])\s+/g, "$1|")
        .split("|")
        .map(s => s.trim())
        .filter(Boolean);

      const cameraAngles = [
        "dramatic medium close-up shot, atmospheric lighting",
        "over-the-shoulder dynamic angle, intense focus",
        "wide cinematic establishing shot, moody depth of field",
        "low-angle hero shot, glowing rim light",
        "emotional close-up expression, shallow depth of field"
      ];

      const result = [];
      for (let i = 0; i < count; i++) {
        const chunkIndex = Math.min(
          rawSentences.length - 1,
          Math.floor((i / count) * rawSentences.length)
        );
        const line = rawSentences[chunkIndex] || story;
        result.push({
          narration: line,
          action: `${line}, ${cameraAngles[i % cameraAngles.length]}`
        });
      }
      return result;
    }

    // ================= RENDER STORYBOARD & VOICEOVER =================
    function renderStoryboard() {
      const section = document.getElementById('storyboard-section');
      const grid = document.getElementById('scenes-grid');
      section.style.display = 'block';
      grid.innerHTML = '';

      currentScenes.forEach((sc, idx) => {
        const card = document.createElement('div');
        card.className = 'scene-card';
        card.innerHTML = `
          <div class="scene-media">
            <span class="scene-badge">Scene ${sc.number}</span>
            <img id="scene-img-${idx}" alt="Scene ${sc.number}" loading="lazy" />
            <div class="scene-caption-overlay"></div>
          </div>
          <div class="scene-body">
            <div class="scene-prompt-text"></div>
            <div class="scene-actions">
              <button class="btn btn-ghost" onclick="speakLine(${idx})">🔊 Voice</button>
              <button class="btn btn-ghost" onclick="regenerateSceneImage(${idx})">🔄 Re-roll</button>
            </div>
          </div>
        `;

        card.querySelector('.scene-caption-overlay').textContent = `"${sc.narration}"`;
        card.querySelector('.scene-prompt-text').textContent = sc.fullPrompt;

        const img = card.querySelector(`#scene-img-${idx}`);
        attachImgFallback(img, `${sc.charName} • Scene ${sc.number}`, sc.narration);
        img.src = sc.imageUrl;

        grid.appendChild(card);
      });

      section.scrollIntoView({ behavior: 'smooth' });
    }

    function regenerateSceneImage(idx) {
      const sc = currentScenes[idx];
      const newSeed = Math.floor(100000 + Math.random() * 900000);
      sc.imageUrl = buildImageUrl(sc.fullPrompt, newSeed);
      const img = document.getElementById(`scene-img-${idx}`);
      delete img.dataset.fbApplied;
      attachImgFallback(img, `${sc.charName} • Scene ${sc.number}`, sc.narration);
      img.src = sc.imageUrl;
      showToast(`🔄 Re-rendering Scene ${sc.number}...`);
    }

    function speakLine(idx, onEndCallback = null) {
      if (!('speechSynthesis' in window)) {
        showToast('Voice synthesis not supported on this browser');
        if (onEndCallback) setTimeout(onEndCallback, 2500);
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(currentScenes[idx].narration);
      utter.rate = parseFloat(document.getElementById('voice-rate').value || '1.1');
      utter.pitch = 1.0;
      if (onEndCallback) {
        utter.onend = onEndCallback;
        utter.onerror = onEndCallback;
      }
      window.speechSynthesis.speak(utter);
    }

    function copyAllPrompts() {
      const text = currentScenes
        .map(s => `SCENE ${s.number}:\nVoiceover: ${s.narration}\nVisual Prompt: ${s.fullPrompt}`)
        .join('\n\n---\n\n');
      navigator.clipboard.writeText(text);
      showToast('📋 All scene scripts & prompts copied!');
    }

    // ================= FULL 9:16 REEL PREVIEW PLAYER =================
    function openReelPlayer() {
      if (!currentScenes.length) return;
      openModal('reel-modal');
      playReelSequence();
    }

    function playReelSequence() {
      clearTimeout(reelTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      let index = 0;

      function nextSlide() {
        if (index >= currentScenes.length) {
          document.getElementById('reel-caption').textContent = '✨ End of Story — Made with KovaStudio AI';
          return;
        }
        const sc = currentScenes[index];
        const reelImg = document.getElementById('reel-img');
        delete reelImg.dataset.fbApplied;
        attachImgFallback(reelImg, `${sc.charName} • Scene ${sc.number}`, sc.narration);
        reelImg.src = sc.imageUrl;
        document.getElementById('reel-caption').textContent = sc.narration;

        speakLine(index, () => {
          index++;
          reelTimer = setTimeout(nextSlide, 500);
        });
      }

      nextSlide();
    }

    function stopReelPlayer() {
      clearTimeout(reelTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      closeModal('reel-modal');
    }
          </script>
