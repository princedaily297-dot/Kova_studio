<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KovaStudio AI — Character Story Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background: #07080d;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px 16px 80px 16px;
      line-height: 1.45;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111522;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
    }

    .sub {
      font-size: 12px;
      color: #94a3b8;
    }

    .credits {
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fde68a;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .box {
      background: #111522;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .box h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #e2e8f0;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      background: #080b12;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 10px;
      padding: 12px;
      color: #ffffff;
      font-size: 15px;
      margin-bottom: 12px;
      display: block;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      display: block;
    }

    .btn-purple {
      background: #7c3aed;
    }

    .btn-cyan {
      background: #0284c7;
    }

    .btn-dark {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.14);
      padding: 9px 12px;
      font-size: 13px;
      width: auto;
      display: inline-block;
    }

    .cast-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-top: 12px;
      padding-bottom: 6px;
    }

    .cast-item {
      min-width: 140px;
      background: #0b0f1a;
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cast-item.active {
      border-color: #8b5cf6;
    }

    .cast-item strong {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .cast-item span {
      display: block;
      font-size: 11px;
      color: #67e8f9;
    }

    .controls-bar {
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls-bar select {
      width: auto;
      margin-bottom: 0;
      padding: 9px 12px;
      font-size: 13px;
    }

    .scenes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .scene-box {
      background: #0b0f1a;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 12px;
    }

    .scene-box img {
      width: 100%;
      aspect-ratio: 9 / 14;
      object-fit: cover;
      border-radius: 10px;
      background: #161d31;
      display: block;
      margin-bottom: 10px;
    }

    .scene-line {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .scene-prompt {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .status-bar {
      margin-top: 10px;
      font-size: 13px;
      color: #67e8f9;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">KovaStudio AI</div>
        <div class="sub">kova_tech and innovation</div>
      </div>
      <div class="credits">⚡ <span id="cr-num">Unlimited</span></div>
    </div>

    <div class="box">
      <h2>Step 1: Create Character</h2>
      <label for="c-name">Character Name</label>
      <input id="c-name" type="text" placeholder="e.g. Tunde" />

      <label for="c-style">Art Style</label>
      <select id="c-style">
        <option value="3D Pixar animation style">3D Pixar Animation</option>
        <option value="Modern anime style">Modern Anime</option>
        <option value="Cinematic film style">Cinematic Film</option>
        <option value="Cyberpunk neon style">Cyberpunk Neon</option>
      </select>

      <label for="c-look">How Character Looks</label>
      <textarea id="c-look" placeholder="e.g. 22yo guy, low fade, glasses, black hoodie, silver chain"></textarea>

      <button type="button" class="btn-purple" onclick="saveChar()">Save Character</button>
      <div id="cast-box" class="cast-list"></div>
    </div>

    <div class="box">
      <h2>Step 2: Story to Scenes</h2>
      <label for="s-text">Your Story</label>
      <textarea id="s-text" placeholder="Write your story here..."></textarea>

      <label for="s-count">Number of Scenes</label>
      <select id="s-count">
        <option value="3">3 Scenes</option>
        <option value="4" selected>4 Scenes</option>
        <option value="5">5 Scenes</option>
      </select>

      <button type="button" class="btn-cyan" onclick="makeScenes()">Generate Scenes (No Limit)</button>
      <div id="status-msg" class="status-bar"></div>
    </div>

    <div id="out-box" class="box" style="display:none;">
      <h2>Step 3: Generated Scenes &amp; Video Sequence</h2>

      <div class="controls-bar">
        <select id="funny-voice">
          <option value="chipmunk">Funny: Chipmunk / Squeaky</option>
          <option value="goofy">Funny: Goofy / Hyper</option>
          <option value="deep_boss">Funny: Deep Boss</option>
          <option value="normal">Normal Voice</option>
        </select>
        <button type="button" class="btn-dark" onclick="playFullVideoSequence()">Play Full Video</button>
        <button type="button" class="btn-dark" onclick="stopFullVideoSequence()">Stop</button>
      </div>

      <div id="scenes-list" class="scenes"></div>
    </div>
  </div>

  <script>
    var cast = [];
    var activeId = null;
    var scenes = [];
    var isPlayingVideo = false;
    var videoTimer = null;

    function setStatus(msg) {
      var el = document.getElementById("status-msg");
      if (el) el.textContent = msg;
    }

    function updateCredits() {
      var el = document.getElementById("cr-num");
      if (el) el.textContent = "Unlimited";
    }

    function makeFallbackImg(title, sub) {
      var t = String(title || "Scene").replace(/[<>&"]/g, "");
      var s = String(sub || "KovaStudio AI").slice(0, 34).replace(/[<>&"]/g, "");
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120"><rect width="720" height="1120" fill="#13192c"/><circle cx="360" cy="430" r="120" fill="#7c3aed" opacity="0.3"/><text x="360" y="452" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="64" font-weight="bold">' + (t.charAt(0) || "K") + '</text><text x="360" y="620" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="32" font-weight="bold">' + t + '</text><text x="360" y="665" text-anchor="middle" fill="#67e8f9" font-family="sans-serif" font-size="20">' + s + '</text></svg>';
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function getFunnyVoiceSettings() {
      var modeEl = document.getElementById("funny-voice");
      var mode = modeEl ? modeEl.value : "chipmunk";
      if (mode === "chipmunk") return { pitch: 1.85, rate: 1.35 };
      if (mode === "deep_boss") return { pitch: 0.45, rate: 0.9 };
      if (mode === "goofy") return { pitch: 1.45, rate: 1.15 };
      return { pitch: 1.0, rate: 1.05 };
    }

    function speakFunny(txt, onDone) {
      if (!("speechSynthesis" in window)) {
        if (onDone) videoTimer = setTimeout(onDone, 2600);
        return;
      }
      try {
        window.speechSynthesis.cancel();
        var utter = new SpeechSynthesisUtterance(txt);
        var cfg = getFunnyVoiceSettings();
        utter.pitch = cfg.pitch;
        utter.rate = cfg.rate;

        var voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
        if (voices && voices.length > 0) {
          utter.voice = voices[0];
        }

        if (onDone) {
          utter.onend = onDone;
          utter.onerror = onDone;
        }
        window.speechSynthesis.speak(utter);
      } catch (e) {
        if (onDone) videoTimer = setTimeout(onDone, 2600);
      }
    }

    function saveChar() {
      var name = document.getElementById("c-name").value.trim();
      var style = document.getElementById("c-style").value;
      var look = document.getElementById("c-look").value.trim();

      if (!name || !look) {
        setStatus("Enter both character name and how they look.");
        return;
      }

      var item = {
        id: String(Date.now()),
        name: name,
        style: style,
        look: look,
        seed: Math.floor(10000 + Math.random() * 90000)
      };

      cast.unshift(item);
      activeId = item.id;
      renderCast();
      setStatus("Saved character: " + name);
    }

    function renderCast() {
      var box = document.getElementById("cast-box");
      box.innerHTML = "";
      cast.forEach(function (c) {
        var div = document.createElement("div");
        div.className = "cast-item" + (c.id === activeId ? " active" : "");
        div.onclick = function () {
          activeId = c.id;
          renderCast();
          setStatus("Selected: " + c.name);
        };
        div.innerHTML = "<strong>" + c.name + "</strong><span>" + c.style + "</span>";
        box.appendChild(div);
      });
    }

    function getActiveChar() {
      for (var i = 0; i < cast.length; i++) {
        if (cast[i].id === activeId) return cast[i];
      }
      return cast[0] || null;
    }

    function makeScenes() {
      var ch = getActiveChar();
      var story = document.getElementById("s-text").value.trim();
      var count = parseInt(document.getElementById("s-count").value, 10) || 4;

      if (!ch) {
        setStatus("Create a character in Step 1 first.");
        return;
      }
      if (!story) {
        setStatus("Write your story in Step 2 first.");
        return;
      }

      var parts = story.replace(/\s+/g, " ").split(/[.!?]+/).map(function (s) {
        return s.trim();
      }).filter(Boolean);

      scenes = [];
      for (var i = 0; i < count; i++) {
        var line = parts.length ? parts[Math.min(parts.length - 1, Math.floor((i / count) * parts.length))] : story;
        var prompt = ch.name + ", " + ch.look + ", " + line + ", " + ch.style + ", safe family friendly portrait, fully clothed";
        var url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt.slice(0, 260)) + "?width=720&height=1120&seed=" + (ch.seed + i) + "&nologo=true&safe=true";
        scenes.push({ num: i + 1, line: line, prompt: prompt, url: url, charName: ch.name });
      }

      updateCredits();
      renderScenes();
      setStatus("Generated " + scenes.length + " scenes (0 limit).");
    }

    function playFullVideoSequence() {
      if (!scenes.length) {
        setStatus("Generate scenes first.");
        return;
      }
      stopFullVideoSequence();
      isPlayingVideo = true;
      var idx = 0;

      function nextScene() {
        if (!isPlayingVideo) return;
        if (idx >= scenes.length) {
          isPlayingVideo = false;
          setStatus("Finished playing full video sequence.");
          return;
        }
        var sc = scenes[idx];
        var cardEl = document.getElementById("scene-card-" + idx);
        if (cardEl && cardEl.scrollIntoView) {
          cardEl.scrollIntoView({ behavior: "smooth", block: "center" });
        }
        setStatus("Playing Scene " + sc.num + " of " + scenes.length + "...");
        speakFunny(sc.line, function () {
          idx += 1;
          if (isPlayingVideo) {
            videoTimer = setTimeout(nextScene, 400);
          }
        });
      }

      nextScene();
    }

    function stopFullVideoSequence() {
      isPlayingVideo = false;
      clearTimeout(videoTimer);
      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
    }

    function renderScenes() {
      var outBox = document.getElementById("out-box");
      var list = document.getElementById("scenes-list");
      outBox.style.display = "block";
      list.innerHTML = "";

      scenes.forEach(function (sc, idx) {
        var card = document.createElement("div");
        card.className = "scene-box";
        card.id = "scene-card-" + idx;

        var img = document.createElement("img");
        img.alt = "Scene " + sc.num;
        img.onerror = function () {
          this.onerror = null;
          this.src = makeFallbackImg(sc.charName + " #" + sc.num, sc.line);
        };
        img.src = sc.url;

        var lineEl = document.createElement("div");
        lineEl.className = "scene-line";
        lineEl.textContent = "Scene " + sc.num + ": " + sc.line;

        var prEl = document.createElement("div");
        prEl.className = "scene-prompt";
        prEl.textContent = sc.prompt;

        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn-dark";
        btn.textContent = "Speak Funny";
        btn.onclick = function () { speakFunny(sc.line, null); };

        card.appendChild(img);
        card.appendChild(lineEl);
        card.appendChild(prEl);
        card.appendChild(btn);
        list.appendChild(card);
      });
    }

    updateCredits();
  </script>
</body>
</html>
