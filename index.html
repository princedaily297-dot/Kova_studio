<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KovaStudio AI — Character Story & Reel Studio</title>
  <style>
    :root {
      --bg-dark: #07080d;
      --bg-card: rgba(17, 21, 34, 0.9);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-active: rgba(139, 92, 246, 0.7);
      --purple: #8b5cf6;
      --purple-deep: #6d28d9;
      --cyan: #06b6d4;
      --gold: #f59e0b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.45;
      padding-bottom: 80px;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #05060b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    #splash-screen.hidden-splash {
      display: none !important;
    }

    .orbit-box {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-top-color: var(--purple);
      border-right-color: var(--cyan);
      animation: spin360 1.4s linear infinite;
    }

    .ring-inner {
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-bottom-color: var(--gold);
      border-left-color: var(--purple);
      animation: spinRev 2s linear infinite;
    }

    .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: 800;
      color: #fff;
    }

    @keyframes spin360 { to { transform: rotate(360deg); } }
    @keyframes spinRev { to { transform: rotate(-360deg); } }

    .splash-title {
      font-size: 25px;
      font-weight: 800;
      color: #ffffff;
    }

    .splash-brand {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .splash-skip-btn {
      margin-top: 22px;
      background: rgba(139, 92, 246, 0.22);
      border: 1px solid var(--border-active);
      color: #ede9fe;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(7, 8, 13, 0.92);
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-group { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 17px; color: #fff;
    }
    .brand-names h1 { font-size: 16px; font-weight: 700; }
    .brand-names p { font-size: 11px; color: var(--text-secondary); }

    .top-controls { display: flex; align-items: center; gap: 8px; }
    .credits-chip {
      padding: 6px 11px; border-radius: 999px;
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fde68a; font-size: 12px; font-weight: 700;
    }
    .icon-action {
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card); color: #fff; font-size: 16px; cursor: pointer;
    }

    .workspace {
      max-width: 900px; margin: 0 auto; padding: 16px;
      display: flex; flex-direction: column; gap: 16px;
    }

    .card {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg); padding: 16px;
    }

    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
    }

    .step-pill {
      background: rgba(139, 92, 246, 0.22); border: 1px solid var(--border-active);
      color: #ddd6fe; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
    }

    .card-title { font-size: 16px; font-weight: 700; display: inline; margin-left: 6px; }
    .card-hint { font-size: 12px; color: var(--text-secondary); }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 620px) { .two-col { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .field input, .field select, .field textarea {
      width: 100%; background: #090c14; border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); padding: 11px 13px; color: #fff; font-family: inherit; font-size: 14px;
    }
    .field textarea { min-height: 82px; resize: vertical; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: none; border-radius: var(--radius-md); padding: 12px 16px;
      font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-full { width: 100%; }
    .btn-purple { background: linear-gradient(135deg, var(--purple), var(--purple-deep)); color: #fff; }
    .btn-cyan { background: linear-gradient(135deg, var(--cyan), #0284c7); color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.08); border: 1px solid var(--border-subtle); color: #fff; padding: 9px 12px; font-size: 12px; }

    .cast-section { margin-top: 14px; display: none; }
    .cast-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .cast-card {
      position: relative; flex: 0 0 138px; background: #0b0e18;
      border: 1.5px solid var(--border-subtle); border-radius: 12px; padding: 8px; cursor: pointer;
    }
    .cast-card.selected { border-color: var(--purple); }
    .cast-thumb { width: 100%; height: 115px; object-fit: cover; border-radius: 8px; background: #14192b; display: block; }
    .cast-name { margin-top: 6px; font-size: 13px; font-weight: 700; }
    .cast-style { font-size: 10px; color: #67e8f9; }
    .cast-remove {
      position: absolute; top: 10px; right: 10px; width: 22px; height: 22px;
      border-radius: 50%; border: none; background: rgba(0,0,0,0.75); color: #fff; cursor: pointer;
    }

    #storyboard-card { display: none; }
    .scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .scene-card { background: #0b0e18; border: 1px solid var(--border-subtle); border-radius: 14px; overflow: hidden; }
    .scene-stage { position: relative; width: 100%; aspect-ratio: 9 / 14; background: #090c16; }
    .scene-stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .scene-tag {
      position: absolute; top: 10px; left: 10px; background: rgba(7,8,13,0.85);
      padding: 4px 8px; border-radius: 7px; font-size: 11px; font-weight: 700;
    }
    .scene-subtitle {
      position: absolute; left: 10px; right: 10px; bottom: 10px;
      background: rgba(0,0,0,0.78); padding: 8px; border-radius: 10px;
      font-size: 12px; font-weight: 600; text-align: center;
    }
    .scene-footer { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .scene-prompt-preview { font-size: 11px; color: var(--text-secondary); }
    .scene-btns { display: flex; gap: 8px; }
    .scene-btns .btn { flex: 1; }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 600; background: rgba(0,0,0,0.86);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-panel {
      width: 100%; max-width: 390px; background: #101422;
      border: 1px solid var(--border-subtle); border-radius: 18px; padding: 16px;
    }
    .reel-screen {
      position: relative; width: 100%; aspect-ratio: 9 / 16; max-height: 64vh;
      border-radius: 14px; overflow: hidden; background: #000;
    }
    .reel-screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .reel-caption {
      position: absolute; left: 12px; right: 12px; bottom: 36px;
      background: rgba(0,0,0,0.76); padding: 8px 10px; border-radius: 10px;
      text-align: center; font-size: 14px; font-weight: 700;
    }

    .toast {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      z-index: 950; background: #1e253d; border: 1px solid var(--border-active);
      color: #fff; padding: 9px 15px; border-radius: 999px; font-size: 12px; display: none;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>

  <div id="splash-screen" onclick="closeSplashNow()">
    <div class="orbit-box">
      <div class="ring-outer"></div>
      <div class="ring-inner"></div>
      <div class="logo-badge">K</div>
    </div>
    <div class="splash-title">KovaStudio AI</div>
    <div class="splash-brand">kova_tech and innovation</div>
    <button type="button" class="splash-skip-btn" onclick="event.stopPropagation(); closeSplashNow();">
      Tap anywhere to enter
    </button>
  </div>

  <header class="topbar">
    <div class="brand-group">
      <div class="brand-icon">K</div>
      <div class="brand-names">
        <h1>KovaStudio AI</h1>
        <p>Character Story Studio</p>
      </div>
    </div>
    <div class="top-controls">
      <div class="credits-chip">⚡ <span id="credits-display">15</span> Cr</div>
      <button type="button" class="icon-action" onclick="openModal('settings-modal')">⚙️</button>
    </div>
  </header>

  <main class="workspace">
    <section class="card">
      <div class="card-header">
        <div><span class="step-pill">STEP 1</span><h2 class="card-title">Character Studio (Cast)</h2></div>
        <span class="card-hint">Create &amp; lock your character</span>
      </div>
      <div class="two-col">
        <div class="field">
          <label for="char-name">Character Name</label>
          <input id="char-name" type="text" placeholder="e.g. Tunde, Zara, Kael" />
        </div>
        <div class="field">
          <label for="char-style">Visual Style</label>
          <select id="char-style">
            <option value="3D Pixar animation style, expressive face, vibrant lighting">3D Pixar Animation</option>
            <option value="Modern anime style, crisp lineart, dramatic lighting">Modern Anime</option>
            <option value="Cinematic film still, 35mm lens, dramatic lighting">Cinematic Film</option>
            <option value="Cyberpunk neon style, moody night lights">Cyberpunk Neon</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="char-appearance">How Your Character Looks</label>
        <textarea id="char-appearance" placeholder="e.g. 22-year-old young man with short fade hair, round glasses, black hoodie, silver chain"></textarea>
      </div>
      <button type="button" class="btn btn-purple btn-full" onclick="addCharacterToCast()">
        ✨ Save &amp; Lock Character in Cast
      </button>

      <div id="cast-section" class="cast-section">
        <div class="field" style="margin-bottom:6px;"><label>Tap a Character to Use:</label></div>
        <div id="cast-row" class="cast-row"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <div><span class="step-pill">STEP 2</span><h2 class="card-title">Story-to-Scene Director</h2></div>
        <span id="selected-char-label" class="card-hint" style="color:#67e8f9; font-weight:600;">No character selected</span>
      </div>
      <div class="field">
        <label for="story-text">Tell Your Story</label>
        <textarea id="story-text" style="min-height:105px;" placeholder="Write your story here..."></textarea>
      </div>
      <div class="two-col">
        <div class="field">
          <label for="scene-total">Number of Scenes (9:16)</label>
          <select id="scene-total">
            <option value="3">3 Scenes (~15s)</option>
            <option value="4" selected>4 Scenes (~25s)</option>
            <option value="5">5 Scenes (~35s)</option>
          </select>
        </div>
        <div class="field">
          <label for="voice-speed">Voiceover Pace</label>
          <select id="voice-speed">
            <option value="0.92">Slow (0.92x)</option>
            <option value="1.0">Normal (1.0x)</option>
            <option value="1.12" selected>Fast TikTok (1.12x)</option>
          </select>
        </div>
      </div>
      <button type="button" id="btn-build-story" class="btn btn-cyan btn-full" onclick="buildStoryboard()">
        🎬 Generate Storyboard (2 Credits)
      </button>
    </section>

    <section id="storyboard-card" class="card">
      <div class="card-header">
        <div><span class="step-pill">STEP 3</span><h2 class="card-title">9:16 Storyboard</h2></div>
        <button type="button" class="btn btn-secondary" onclick="startReelPreview()">▶️ Play Reel</button>
      </div>
      <div id="scene-grid" class="scene-grid"></div>
      <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
        <button type="button" class="btn btn-purple" style="flex:1; min-width:200px;" onclick="startReelPreview()">
          📱 Open 9:16 Reel Preview + Voice
        </button>
        <button type="button" class="btn btn-secondary" onclick="copyStoryboardScript()">
          📋 Copy Script &amp; Prompts
        </button>
      </div>
    </section>
  </main>

  <div id="settings-modal" class="modal-overlay">
    <div class="modal-panel">
      <div class="card-header">
        <h3 class="card-title" style="margin-left:0;">⚙️ Studio Settings</h3>
        <button type="button" class="icon-action" onclick="closeModal('settings-modal')">✕</button>
      </div>
      <div class="field">
        <label for="gemini-key">Gemini API Key (Optional)</label>
        <input id="gemini-key" type="password" placeholder="AIzaSy..." />
      </div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn btn-purple" style="flex:1;" onclick="saveApiKey()">Save Key</button>
        <button type="button" class="btn btn-secondary" onclick="addTestCredits()">+10 Credits</button>
      </div>
    </div>
  </div>

  <div id="reel-modal" class="modal-overlay">
    <div class="modal-panel">
      <div class="card-header">
        <h3 class="card-title" style="margin-left:0;">📱 9:16 Reel Preview</h3>
        <button type="button" class="icon-action" onclick="stopReelPreview()">✕</button>
      </div>
      <div class="reel-screen">
        <img id="reel-image" alt="Reel frame" />
        <div id="reel-subtitle" class="reel-caption">Starting...</div>
      </div>
      <div style="margin-top:10px; display:flex; gap:8px;">
        <button type="button" class="btn btn-cyan" style="flex:1;" onclick="runReelSlides()">🔄 Replay</button>
        <button type="button" class="btn btn-secondary" onclick="stopReelPreview()">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    function closeSplashNow() {
      var el = document.getElementById("splash-screen");
      if (el) el.classList.add("hidden-splash");
    }
    setTimeout(closeSplashNow, 1500);

    var state = { credits: 15, cast: [], selectedCharId: null, scenes: [] };
    var reelTimer = null;

    function getStore(k, d) {
      try { var v = localStorage.getItem(k); return v !== null ? v : d; } catch (e) { return d; }
    }
    function setStore(k, v) {
      try { localStorage.setItem(k, String(v)); } catch (e) {}
    }

    function showToast(msg) {
      var t = document.getElementById("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(function () { t.classList.remove("show"); }, 2500);
    }

    state.credits = parseInt(getStore("kova_cr", "15"), 10) || 15;
    try { state.cast = JSON.parse(getStore("kova_cast_v2", "[]")) || []; } catch (e) { state.cast = []; }
    state.selectedCharId = getStore("kova_sel_v2", null);

    function renderCredits() {
      var el = document.getElementById("credits-display");
      if (el) el.textContent = state.credits;
      setStore("kova_cr", state.credits);
    }
    function addTestCredits() { state.credits += 10; renderCredits(); showToast("⚡ +10 Credits"); }
    function openModal(id) { var m = document.getElementById(id); if (m) m.classList.add("open"); }
    function closeModal(id) { var m = document.getElementById(id); if (m) m.classList.remove("open"); }
    function saveApiKey() {
      var k = document.getElementById("gemini-key").value.trim();
      setStore("kova_gem_key", k);
      closeModal("settings-modal");
      showToast(k ? "✅ API key saved" : "Saved");
    }

    function makeSvgFallback(title, sub) {
      var t = String(title || "KovaStudio").slice(0, 22).replace(/[<>&"]/g, "");
      var s = String(sub || "Scene").slice(0, 32).replace(/[<>&"]/g, "");
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1152" viewBox="0 0 720 1152"><rect width="720" height="1152" fill="#13192b"/><circle cx="360" cy="450" r="130" fill="#8b5cf6" opacity="0.25"/><text x="360" y="472" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="60" font-weight="bold">' + (t.charAt(0) || "K") + '</text><text x="360" y="650" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="30" font-weight="bold">' + t + '</text><text x="360" y="695" text-anchor="middle" fill="#67e8f9" font-family="sans-serif" font-size="18">' + s + '</text></svg>';
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function imgUrl(prompt, seed, w, h) {
      return "https://image.pollinations.ai/prompt/" + encodeURIComponent(String(prompt).slice(0, 280)) + "?width=" + (w || 720) + "&height=" + (h || 1152) + "&seed=" + seed + "&nologo=true";
    }

    function setSafeImg(img, url, title, sub) {
      delete img.dataset.fb;
      img.onerror = function () {
        if (!img.dataset.fb) { img.dataset.fb = "1"; img.src = makeSvgFallback(title, sub); }
      };
      img.src = url;
    }

    function addCharacterToCast() {
      var name = document.getElementById("char-name").value.trim();
      var style = document.getElementById("char-style").value;
      var desc = document.getElementById("char-appearance").value.trim();
      if (!name || !desc) { showToast("⚠️ Enter character name and look"); return; }

      var seed = Math.floor(100000 + Math.random() * 900000);
      var obj = {
        id: "c_" + Date.now(),
        name: name,
        style: style,
        description: desc,
        seed: seed,
        avatarUrl: imgUrl(name + ", " + desc + ", " + style, seed, 512, 512)
      };
      state.cast.unshift(obj);
      state.selectedCharId = obj.id;
      setStore("kova_cast_v2", JSON.stringify(state.cast));
      setStore("kova_sel_v2", obj.id);
      renderCast();
      showToast("✨ " + name + " saved");
    }
