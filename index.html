<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KovaStudio AI — Character-First Story Director</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #07080d;
      --bg-surface: rgba(18, 21, 33, 0.72);
      --bg-elevated: rgba(28, 33, 52, 0.85);
      --border-glass: rgba(255, 255, 255, 0.09);
      --border-glow: rgba(139, 92, 246, 0.45);
      --accent-primary: #8b5cf6;
      --accent-secondary: #06b6d4;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(139, 92, 246, 0.16), transparent 38%),
        radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.12), transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 90px;
    }

    h1, h2, h3, .brand-font {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* ================= SPLASH SCREEN ================= */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #05060a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .orbital-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .orbit-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent-primary);
      border-right-color: var(--accent-secondary);
      animation: spin 1.6s linear infinite;
    }

    .orbit-ring-inner {
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: var(--accent-gold);
      border-left-color: var(--accent-primary);
      animation: spinReverse 2.2s linear infinite;
    }

    .orbit-core {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: #fff;
      box-shadow: 0 0 28px rgba(139, 92, 246, 0.65);
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinReverse { to { transform: rotate(-360deg); } }

    .splash-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff, #c4b5fd, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .splash-sub {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .splash-loader-bar {
      width: 180px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      margin-top: 22px;
      overflow: hidden;
    }

    .splash-loader-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      animation: loadBar 1.8s ease forwards;
    }

    @keyframes loadBar { to { width: 100%; } }

    /* ================= TOP NAVBAR ================= */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(7, 8, 13, 0.78);
      border-bottom: 1px solid var(--border-glass);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
    }

    .nav-brand-text h1 {
      font-size: 17px;
      line-height: 1.1;
    }

    .nav-brand-text span {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.6px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .credit-pill {
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fcd34d;
      padding: 5px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }

    .icon-btn:active { transform: scale(0.94); }

    /* ================= MAIN LAYOUT ================= */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .glass-card {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
    }

    .step-badge {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid var(--border-glow);
      color: #c4b5fd;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    /* ================= FORM INPUTS ================= */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      background: rgba(9, 11, 18, 0.85);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 11px 13px;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-primary);
    }

    textarea {
      resize: vertical;
      min-height: 86px;
      line-height: 1.45;
    }

    /* ================= BUTTONS ================= */
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary), #6d28d9);
      color: #fff;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.35);
      width: 100%;
    }

    .btn-cyan {
      background: linear-gradient(135deg, var(--accent-secondary), #0284c7);
      color: #fff;
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.3);
      width: 100%;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 8px 12px;
      font-size: 12px;
    }

    /* ================= CAST LIBRARY ================= */
    .cast-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-top: 14px;
      scrollbar-width: none;
    }
    .cast-strip::-webkit-scrollbar { display: none; }

    .cast-card {
      min-width: 145px;
      max-width: 145px;
      background: var(--bg-elevated);
      border: 1.5px solid var(--border-glass);
      border-radius: 14px;
      padding: 8px;
      cursor: pointer;
      position: relative;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .cast-card.active {
      border-color: var(--accent-primary);
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.35);
    }

    .cast-avatar {
      width: 100%;
      height: 130px;
      border-radius: 10px;
      object-fit: cover;
      background: #121521;
      display: block;
    }

    .cast-name {
      font-size: 13px;
      font-weight: 700;
      margin-top: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cast-style-tag {
      font-size: 10px;
      color: var(--accent-secondary);
      font-weight: 600;
    }

    .cast-del {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: none;
      font-size: 12px;
      cursor: pointer;
    }

    /* ================= STORYBOARD SCENES ================= */
    .scenes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .scene-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .scene-media {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 14;
      background: #0b0d15;
      overflow: hidden;
    }

    .scene-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 6s ease;
    }

    .scene-card:hover .scene-media img {
      transform: scale(1.06);
    }

    .scene-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(7, 8, 13, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }

    .scene-caption-overlay {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .scene-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .scene-prompt-text {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .scene-actions {
      display: flex;
      gap: 6px;
      margin-top: auto;
    }

    .scene-actions button {
      flex: 1;
    }

    /* ================= FULLSCREEN TIKTOK REEL PREVIEW MODAL ================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(4, 5, 10, 0.88);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 400px;
      background: #10131f;
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 18px;
      position: relative;
    }

    .reel-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 68vh;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .reel-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: kenBurns 7s ease-in-out infinite alternate;
    }

    @keyframes kenBurns {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.1) translate(-1%, -1%); }
    }

    .reel-subtitles {
      position: absolute;
      bottom: 48px;
      left: 14px;
      right: 14px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.95);
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 12px;
      border-radius: 12px;
    }

    .reel-watermark {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 6px;
      color: #c4b5fd;
    }

    /* ================= TOAST & FOOTER ================= */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e2336;
      border: 1px solid var(--border-glow);
      color: #fff;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 500;
      z-index: 900;
      transition: transform 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 24px;
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <!-- ORBITAL SPLASH SCREEN -->
  <div id="splash-screen">
    <div class="orbital-wrapper">
      <div class="orbit-ring"></div>
      <div class="orbit-ring-inner"></div>
      <div class="orbit-core">K</div>
    </div>
    <div class="splash-title brand-font">KovaStudio AI</div>
    <div class="splash-sub">kova_tech and innovation</div>
    <div class="splash-loader-bar"><div class="splash-loader-fill"></div></div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="nav-brand">
      <div class="nav-logo">K</div>
      <div class="nav-brand-text">
        <h1>KovaStudio AI</h1>
        <span>Character-First Story Engine</span>
      </div>
    </div>
    <div class="nav-actions">
      <div class="credit-pill" title="Studio Generation Credits">
        ⚡ <span id="credit-count">15</span> Credits
      </div>
      <button class="icon-btn" onclick="openModal('settings-modal')" title="API & Voice Settings">⚙️</button>
    </div>
  </header>

  <main class="container">

    <!-- STEP 1: CHARACTER STUDIO -->
    <section class="glass-card">
      <div class="section-header">
        <div class="section-title">
          <span class="step-badge">STEP 1</span>
          <span>Character Studio ("Cast")</span>
        </div>
        <span style="font-size:11px; color:var(--text-muted);">Lock consistent look</span>
      </div>

      <div class="form-grid">
        <div class="input-group">
          <label>Character Name</label>
          <input type="text" id="char-name" placeholder="e.g. Tunde, Zara, Captain Neo" />
        </div>
        <div class="input-group">
          <label>Visual Art Style</label>
          <select id="char-style">
            <option value="3D Pixar Disney animation style, vibrant lighting, expressive face, 8k">3D Pixar / Disney Style</option>
            <option value="Modern high-budget Anime style, sharp lineart, dramatic lighting, Makoto Shinkai vibe">Modern Anime</option>
            <option value="Ultra-realistic cinematic film still, 35mm lens, moody lighting, photorealistic">Cinematic Photorealistic</option>
            <option value="Cyberpunk neon digital art, futuristic Lagos/Tokyo aesthetic, glowing accents">Cyberpunk Neon</option>
            <option value="Dark comic book graphic novel illustration, bold ink shadows, high contrast">Dark Comic / Graphic Novel</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label>How Your Character Looks (Face, Hair, Outfit, Vibe)</label>
        <textarea id="char-desc" placeholder="Describe exact details so the AI keeps them identical in every scene: e.g. 22-year-old young Nigerian man with low fade haircut, round glasses, wearing an oversized black tech hoodie and silver chain"></textarea>
      </div>

      <button class="btn btn-primary" id="btn-create-char" onclick="createCharacter()">
        ✨ Generate & Lock Character in Cast
      </button>

      <!-- SAVED CAST STRIP -->
      <div id="cast-container" style="display:none; margin-top: 16px;">
        <label style="display:block; margin-bottom:6px;">Select Active Character for Your Story:</label>
        <div class="cast-strip" id="cast-list"></div>
      </div>
    </section>

    <!-- STEP 2: STORY INPUT -->
    <section class="glass-card">
      <div class="section-header">
        <div class="section-title">
          <span class="step-badge">STEP 2</span>
          <span>Story-to-Scene Director</span>
        </div>
        <span id="active-char-indicator" style="font-size:11px; color:var(--accent-secondary); font-weight:600;">No character selected</span>
      </div>

      <div class="input-group">
        <label>Tell Your Story (Paste plot, script, or rough idea)</label>
        <textarea id="story-input" style="min-height:115px;" placeholder="Example: Tunde was broke in his small room coding on an old laptop at 2 AM. Suddenly his screen flashed green—his new app just hit 10,000 users overnight. He stepped onto his balcony looking over the glowing city skyline, realizing everything had changed."></textarea>
      </div>

      <div class="form-grid">
        <div class="input-group">
          <label>Number of TikTok Scenes (9:16)</label>
          <select id="scene-count">
            <option value="3">3 Scenes (~15 sec Short)</option>
            <option value="4" selected>4 Scenes (~25 sec TikTok)</option>
            <option value="5">5 Scenes (~35 sec Story)</option>
          </select>
        </div>
        <div class="input-group">
          <label>Narrator Voice Tone</label>
          <select id="voice-rate">
            <option value="1.0">Normal Storyteller (1.0x)</option>
            <option value="1.12" selected>Fast TikTok Hook Pace (1.12x)</option>
            <option value="0.92">Deep Dramatic Slow (0.92x)</option>
          </select>
        </div>
